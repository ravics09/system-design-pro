services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - idem-mongo:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3134
      MONGODB_URI: mongodb://mongo:27017/idempotency
      KEY_TTL_S: ${KEY_TTL_S:-86400}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '3134:3134'

volumes:
  idem-mongo:
