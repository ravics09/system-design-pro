services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - logs-mongo:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3115
      MONGODB_URI: mongodb://mongo:27017/logs
      FLUSH_SIZE: ${FLUSH_SIZE:-100}
      FLUSH_INTERVAL_MS: ${FLUSH_INTERVAL_MS:-1000}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '3115:3115'

volumes:
  logs-mongo:
