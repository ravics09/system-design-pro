services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3102
      REDIS_URL: redis://redis:6379
      PRESENCE_TTL_S: ${PRESENCE_TTL_S:-30}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - '3102:3102'
