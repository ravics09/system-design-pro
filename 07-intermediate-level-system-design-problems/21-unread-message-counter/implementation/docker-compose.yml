services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - unread-mongo:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3121
      REDIS_URL: redis://redis:6379
      MONGODB_URI: mongodb://mongo:27017/unread
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '3121:3121'

volumes:
  unread-mongo:
