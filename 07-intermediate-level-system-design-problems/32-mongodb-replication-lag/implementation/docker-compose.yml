# A single-node replica set so read preferences / causal sessions / majority concerns take effect.
# (Real lag needs multiple data-bearing nodes; the mechanics are identical.)
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    volumes:
      - replag-mongo:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3132
      MONGODB_URI: mongodb://mongo:27017/replag?replicaSet=rs0
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '3132:3132'

volumes:
  replag-mongo:
