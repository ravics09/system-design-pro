<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Real-Time Chat — demo client</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
      #log { border: 1px solid #ccc; border-radius: 8px; height: 320px; overflow-y: auto; padding: 8px; }
      .msg { margin: 4px 0; } .me { color: #0a58ca; }
      input, button { padding: 8px; font-size: 1rem; }
      .row { display: flex; gap: 8px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <h1>Real-Time Chat</h1>
    <div class="row">
      <input id="user" placeholder="your name" value="alice" />
      <input id="conv" placeholder="conversation id" value="room1" />
      <button id="connect">Connect</button>
    </div>
    <div id="log"></div>
    <div class="row">
      <input id="text" placeholder="message" style="flex:1" />
      <button id="send" disabled>Send</button>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
      let socket;
      const log = (html, cls = '') => {
        const d = document.getElementById('log');
        d.insertAdjacentHTML('beforeend', `<div class="msg ${cls}">${html}</div>`);
        d.scrollTop = d.scrollHeight;
      };
      document.getElementById('connect').onclick = async () => {
        const userId = document.getElementById('user').value.trim();
        const conv = document.getElementById('conv').value.trim();
        const { token } = await fetch('/api/token?userId=' + encodeURIComponent(userId)).then((r) => r.json());
        socket = io({ auth: { token } });
        socket.on('connect', () => { log('<em>connected</em>'); socket.emit('join', conv); document.getElementById('send').disabled = false; });
        socket.on('message', (m) => log(`<b>${m.senderId}:</b> ${m.body}`, m.senderId === userId ? 'me' : ''));
        socket.on('typing', (t) => log(`<em>${t.userId} is typing…</em>`));
      };
      document.getElementById('send').onclick = () => {
        const conv = document.getElementById('conv').value.trim();
        const body = document.getElementById('text').value;
        if (!body) return;
        socket.emit('message', { conversationId: conv, clientMsgId: crypto.randomUUID(), body });
        document.getElementById('text').value = '';
      };
    </script>
  </body>
</html>
