services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - optimistic-mongo:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3114
      MONGODB_URI: mongodb://mongo:27017/optimistic
      MAX_RETRIES: ${MAX_RETRIES:-5}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '3114:3114'

volumes:
  optimistic-mongo:
