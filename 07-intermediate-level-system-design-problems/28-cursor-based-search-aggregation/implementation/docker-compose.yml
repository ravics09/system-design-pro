services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - search-mongo:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3128
      MONGODB_URI: mongodb://mongo:27017/search
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '3128:3128'

volumes:
  search-mongo:
